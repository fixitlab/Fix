<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify your FIX account</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f7f7f7;padding:20px}.verify-card{max-width:440px;width:100%;background:#fff;border-radius:20px;padding:28px;box-shadow:0 12px 40px #0001;text-align:center}.verify-mark{font-size:38px;font-weight:900;font-style:italic;color:#c90000}.verify-card button{width:100%;padding:14px;background:#c90000;color:#fff;margin-top:14px}.verify-card p{color:#666;line-height:1.5}</style></head><body><main class="verify-card"><div class="verify-mark"><img src="assets/fixit_logo_transparent.png" alt="FIX" style="width:140px;max-width:100%;height:auto"></div><h1>Verify your email</h1><p id="status">Tap the button below to verify your email address and continue to FIX.</p><button id="verifyBtn">Verify email and continue</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://mlkkkbzpwxhuhbigzgqb.supabase.co';const SUPABASE_KEY='sb_publishable_0wTMiTdyI-l9XR5F2Nwwug_703_jGyZ';const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const params=new URLSearchParams(location.search);const tokenHash=params.get('token_hash');const type=params.get('type')||'email';const status=document.getElementById('status');const button=document.getElementById('verifyBtn');button.addEventListener('click',async()=>{button.disabled=true;button.textContent='Verifying…';try{if(tokenHash){const {error}=await client.auth.verifyOtp({token_hash:tokenHash,type});if(error)throw error;}else{const {data,error}=await client.auth.getSession();if(error)throw error;if(!data.session)throw new Error('This link is missing its verification token. Request a new verification email and use the latest link.');}status.textContent='Your email is verified. Opening FIX…';button.textContent='Verified';setTimeout(()=>location.replace('./index.html'),900);}catch(e){status.textContent=e.message||'Verification could not be completed. Request a new email and try again.';button.disabled=false;button.textContent='Try verification again';}});
</script></body></html>
